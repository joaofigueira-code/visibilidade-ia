name: Perguntas de visibilidade em IA

on:
  schedule:
    # de madrugada e em minutos fora de hora: o GitHub chega a atrasar 6 horas os agendamentos das horas certas.
    # A segunda corrida so pergunta o que faltar. A rotina na nuvem junta as respostas as 09:00 (Lisboa).
    - cron: '23 2 * * *'
    - cron: '41 5 * * *'
  workflow_dispatch:       # botao "Run workflow" para correr a qualquer hora
  push:                    # e quando se muda o script ou as perguntas (para testar)
    paths: ['perguntar.py', 'perguntas.json', '.github/workflows/perguntar.yml']

permissions:
  contents: write

concurrency:
  group: perguntas
  cancel-in-progress: false

jobs:
  perguntar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fazer as 12 perguntas ao Gemini e ao gpt-oss
        timeout-minutes: 30
        run: python3 -u perguntar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Gravar as respostas no repositorio
        if: always()
        run: |
          git config user.name "rotina-ia"
          git config user.email "rotina-ia@users.noreply.github.com"
          git add respostas || true
          git diff --cached --quiet && exit 0
          git commit -m "Respostas de $(TZ=Europe/Lisbon date +%F)"
          git pull --rebase
          git push
